<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Заказать расчет — KAZ MC GROUP</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090d14;
      --bg-card: #111823;
      --border: #1f2b3d;
      --turquoise: #00e5ff;
      --turquoise-dark: #00b8cc;
      --turquoise-glow: rgba(0, 229, 255, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.5; }
    a { text-decoration: none; color: inherit; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(9, 13, 20, 0.95); backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border); padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .logo-wrap { display: flex; align-items: center; gap: 8px; }
    .logo-wrap img { height: 38px; width: auto; }
    .logo-fallback { background: linear-gradient(135deg, var(--turquoise), #0077ff); color: #000; font-weight: 900; padding: 6px 10px; font-size: 14px; border-radius: 4px; }
    .brand-name { font-size: 16px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
    .brand-name span { color: var(--turquoise); }

    nav { display: flex; gap: 15px; align-items: center; width: 100%; justify-content: center; padding-top: 5px; border-top: 1px solid var(--border); }
    nav a { font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--text-muted); }
    nav a.active { color: var(--turquoise); }

    .lang-switch { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .lang-btn { background: var(--bg-card); color: var(--text-muted); border: none; padding: 5px 8px; font-weight: 800; cursor: pointer; font-size: 11px; font-family: inherit; }
    .lang-btn.active { background: var(--turquoise); color: #000; }

    .container { max-width: 800px; margin: 0 auto; padding: 30px 16px; }
    .form-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-top: 4px solid var(--turquoise); padding: 24px 16px; border-radius: 8px;
    }
    .form-card h1 { font-size: 22px; text-transform: uppercase; margin-bottom: 8px; }
    .form-card h1 span { color: var(--turquoise); }
    .form-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-bottom: 6px; color: var(--turquoise); }
    input[type="text"], input[type="tel"], select, textarea {
      width: 100%; background: #090d14; border: 1px solid var(--border);
      color: #fff; padding: 12px; border-radius: 6px; font-family: inherit; font-size: 14px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--turquoise); }
    textarea { min-height: 100px; resize: vertical; }

    .file-box {
      border: 2px dashed var(--turquoise); background: rgba(0, 229, 255, 0.05);
      padding: 16px; text-align: center; border-radius: 6px; cursor: pointer;
    }
    .file-box input { display: none; }
    .file-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .submit-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 24px; }
    .btn-turquoise {
      background: var(--turquoise); color: #06090e; font-weight: 900; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 14px; border: none; border-radius: 6px; cursor: pointer;
      box-shadow: 0 0 15px var(--turquoise-glow); font-family: inherit; font-size: 13px; text-align: center; width: 100%;
    }

    @media (min-width: 768px) {
      header { padding: 15px 5%; }
      nav { width: auto; border-top: none; padding-top: 0; gap: 25px; }
      nav a { font-size: 14px; }
      .container { padding: 60px 5%; }
      .form-card { padding: 40px; }
      .submit-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-wrap">
      <img src="images/logo.png" alt="KAZ MC GROUP" onerror="this.style.display='none'; document.getElementById('logo-fb').style.display='block';">
      <div id="logo-fb" class="logo-fallback" style="display:none;">KAZ MC</div>
      <div class="brand-name">KAZ <span>MC</span> GROUP</div>
    </a>
    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('ru')" id="btn-ru">RU</button>
      <button class="lang-btn" onclick="setLang('kz')" id="btn-kz">KZ</button>
    </div>
    <nav>
      <a href="index.html" data-ru="Главная" data-kz="Басты бет">Главная</a>
      <a href="catalog.html" data-ru="Продукция и ГОСТ" data-kz="Өнімдер мен МЕМСТ">Продукция и ГОСТ</a>
      <a href="order.html" class="active" data-ru="Заказать расчет" data-kz="Есептеу">Заказать расчет</a>
    </nav>
  </header>

  <div class="container">
    <div class="form-card">
      <h1 data-ru="Заказать <span>расчет</span>" data-kz="Есептеуге <span>тапсырыс беру</span>">Заказать <span>расчет</span></h1>
      <p data-ru="Заполните заявку и выберите мессенджер (+7 771 128 80 40) для отправки инженерам KAZ MC GROUP." data-kz="Өтінімді толтырып, KAZ MC GROUP инженерлеріне жіберу үшін мессенджерді таңдаңыз.">Заполните заявку и выберите мессенджер (+7 771 128 80 40) для отправки инженерам KAZ MC GROUP.</p>

      <div class="form-group">
        <label data-ru="Ваше Имя / Компания *" data-kz="Атыңыз / Компания *">Ваше Имя / Компания *</label>
        <input type="text" id="clientName" placeholder="ТОО Строй / Аскар" required>
      </div>

      <div class="form-group">
        <label data-ru="Номер телефона *" data-kz="Телефон нөмірі *">Номер телефона *</label>
        <input type="tel" id="clientPhone" placeholder="+7 (771) 128-80-40" required>
      </div>

      <div class="form-group">
        <label data-ru="Тип металлоконструкции" data-kz="Металл конструкциясының түрі">Тип металлоконструкции</label>
        <select id="projectType">
          <option value="Ангары и склады">Ангары и склады</option>
          <option value="Каркасы зданий">Каркасы зданий</option>
          <option value="Навесы">Навесы</option>
          <option value="Лестницы и ограждения">Лестницы и ограждения</option>
          <option value="Ворота">Ворота</option>
          <option value="Нестандартные изделия на заказ">Нестандартные изделия на заказ</option>
        </select>
      </div>

      <div class="form-group">
        <label data-ru="Чертеж / Проект (PDF, DWG, Фото)" data-kz="Сызба / Жоба (PDF, DWG, Фото)">Чертеж / Проект (PDF, DWG, Фото)</label>
        <label class="file-box">
          <input type="file" id="blueprintFile" onchange="updateFileName()">
          <div id="fileLabel" data-ru="📎 Выбрать файл чертежа" data-kz="📎 Сызба файлын таңдау">📎 Выбрать файл чертежа</div>
          <div class="file-hint" data-ru="Файл прикрепится в чате мессенджера" data-kz="Файл чатта тіркеледі">Файл прикрепится в чате мессенджера</div>
        </label>
      </div>

      <div class="form-group">
        <label data-ru="Проектная информация (размеры, город)" data-kz="Жобалық ақпарат (өлшемдері, қала)">Проектная информация (размеры, город)</label>
        <textarea id="projectInfo" placeholder="Габариты, тоннаж, город монтажа (Астана и др.)..."></textarea>
      </div>

      <div class="submit-grid">
        <button type="button" class="btn-turquoise" onclick="sendOrder('whatsapp')">
          💬 Отправить в WhatsApp
        </button>
        <button type="button" class="btn-turquoise" onclick="sendOrder('telegram')">
          ✈️ Отправить в Telegram
        </button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('type')) {
      document.getElementById('projectType').value = params.get('type');
    }

    function updateFileName() {
      const fileInput = document.getElementById('blueprintFile');
      const label = document.getElementById('fileLabel');
      if (fileInput.files.length > 0) {
        label.innerHTML = '✅ Файл: <strong>' + fileInput.files[0].name + '</strong>';
      }
    }

    function sendOrder(channel) {
      const name = document.getElementById('clientName').value.trim();
      const phone = document.getElementById('clientPhone').value.trim();
      const type = document.getElementById('projectType').value;
      const info = document.getElementById('projectInfo').value.trim() || 'Не указано';
      const fileInput = document.getElementById('blueprintFile');
      const fileName = fileInput.files.length > 0 ? fileInput.files[0].name : 'Прикреплю в чате';

      if (!name || !phone) {
        alert('Укажите Ваше имя и телефон!');
        return;
      }

      const message =
        `🏗 *ЗАЯВКА НА РАСЧЕТ — KAZ MC GROUP*\n` +
        `👤 *Имя / Компания:* ${name}\n` +
        `📞 *Телефон:* ${phone}\n` +
        `🔩 *Конструкция:* ${type}\n` +
        `📐 *Чертеж:* ${fileName}\n` +
        `📋 *Информация:* ${info}`;

      const encoded = encodeURIComponent(message);

      if (channel === 'whatsapp') {
        window.open(`https://wa.me/77711288040?text=${encoded}`, '_blank');
      } else {
        navigator.clipboard?.writeText(message);
        window.open(`https://t.me/+77711288040`, '_blank');
        alert('Текст скопирован! Вставьте его в чате Telegram (+7 771 128 80 40) и отправьте чертеж.');
      }
    }

    let currentLang = localStorage.getItem('kazmc_lang') || 'ru';
    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('kazmc_lang', lang);
      document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
      document.getElementById('btn-kz').classList.toggle('active', lang === 'kz');
      document.querySelectorAll('[data-' + lang + ']').forEach(el => {
        el.innerHTML = el.getAttribute('data-' + lang);
      });
    }
    setLang(currentLang);
  </script>
</body>
</html>
